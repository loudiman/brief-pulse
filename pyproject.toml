[project]
name = "briefpulse"
version = "0.1.0"
description = "Daily campaign-compliance checker: pulls creators' latest YouTube posts, checks them against the campaign brief, stores results, flags problems in Discord."
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.32",
    "PyYAML>=6.0",
    "google-genai>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
briefpulse = "briefpulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
